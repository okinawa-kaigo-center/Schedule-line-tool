<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>月間スケジュール作成は移りました｜沖縄介護センター</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EDEE;--card:#fff;--ink:#16262B;--muted:#67797F;--line:#DDE4E6;--accent:#0E5A61;--warn:#8A5300;--warn-bg:#FBEBD2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.75}
header{background:var(--accent);color:#fff;padding:14px 16px;font-weight:700;font-size:17px}
.wrap{max-width:620px;margin:0 auto;padding:14px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
h1{font-size:19px;margin:0 0 6px}
.go{display:block;margin-top:12px;padding:14px;border-radius:12px;background:var(--accent);color:#fff;text-align:center;font-weight:700;font-size:17px;text-decoration:none}
.sub{display:block;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--accent);color:var(--accent);text-align:center;font-weight:700;text-decoration:none}
.url{font-size:13px;color:var(--muted);word-break:break-all;text-align:center;margin-top:6px}
.warn{background:var(--warn-bg);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:15px}
.warn b{color:var(--warn)}
.warn[hidden]{display:none}
</style>
</head>
<body>
<header>スケジュール作成＆LINE送信</header>
<div class="wrap">
  <div class="card">
    <h1>月間スケジュール作成は、事業所のツール集に移りました</h1>
    これからは新しいアドレスで使ってください。ブックマークやホーム画面のアイコンも、新しいアドレスに置き換えてください。
    <a class="go" href="https://okc-houmon-tools.web.app/schedule/getsukan">新しい月間スケジュール作成を開く</a>
    <div class="url">https://okc-houmon-tools.web.app/schedule/getsukan</div>
    <a class="sub" href="https://okc-houmon-tools.web.app/schedule/">毎日の送信はこちら</a>
  </div>
  <div class="warn" id="left" hidden>
    <b>この端末に、前のアドレスで作業した内容が残っています。</b><br>
    アドレスが変わったため、そのままでは新しいアドレスに出てきません。続きから使うときは、先に引っ越しをしてください。
    <a class="sub" href="hikkoshi.html" style="background:#fff">データの引っ越しをする</a>
  </div>
</div>
<script>
// この端末に前のアドレスの保存が残っていれば、引っ越しの案内を出す
try{
  for(var i=0;i<localStorage.length;i++){
    var k = localStorage.key(i);
    if(/^(base|memo|man|note|pair|edit)_|^getsu_|^(tpl|skip|cars|carlist|staffnames)$/.test(k)){ document.getElementById("left").hidden = false; break; }
  }
}catch(e){}
</script>
</body>
</html>
